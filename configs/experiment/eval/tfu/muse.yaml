# @package _global_

defaults:
  - /data/datasets@data.forget: MUSE_forget
  - /data/datasets@data.retain: MUSE_retain
  # - override /model: Llama-2-7b-hf
  - override /model: Llama-3.2-1B-Instruct
  - override /eval: muse

data_split: News
forget_split: forget
retain_split: retain1
retain_logs_path: null

model:
  model_args:
    #pretrained_model_name_or_path: muse-bench/MUSE-${data_split}_target
    pretrained_model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
  model_handler: TFULlamaForCausalLM
  w: 1

tfu:
  FAISS_model: "BAAI/bge-base-en-v1.5"
  search_type: "similarity"
  search_topk: 1
  help_model:
    pretrained_model_name_or_path: "meta-llama/Llama-3.2-1B-Instruct"
    attn_implementation: "flash_attention_2"
    torch_dtype: "bfloat16"
  activation_method: similarity
  activation_threshold: 0.55

data:
  anchor: forget
  forget:
    MUSE_forget: 
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}
  retain:
    MUSE_retain:
      args:
        hf_args:
          path: muse-bench/MUSE-${data_split}
          split: ${retain_split}


eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

task_name: ???